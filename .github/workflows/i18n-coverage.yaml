name: i18n Content Coverage

on:
  pull_request:
    paths:
      - 'messages/**'
      - 'src/content/pages/**'
      - 'src/content/posts/**'
      - 'scripts/i18n/**'
      - 'project.inlang/settings.json'
      - 'src/routes/sitemap[.]xml.ts'
      - 'src/routes/text-to-image.tsx'
      - 'src/routes/bulin-47-ai.tsx'
      - 'src/routes/ai-zombie-hug.tsx'
      - 'src/routes/hotel-lobby-ai.tsx'
      - 'src/routes/ai-rumpelstiltskin.tsx'
      - 'src/components/landing/rumpel-seo-i18n.ts'
      - '.github/workflows/i18n-coverage.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every message key and interpolation token
        run: node scripts/i18n/check-coverage.mjs --strict
      - name: Check every localized policy and blog article
        run: node scripts/i18n/check-content.mjs --strict
      - name: Check Rumpelstiltskin editorial IDs, source freshness and schema language
        run: node scripts/i18n/check-rumpel-seo.mjs
