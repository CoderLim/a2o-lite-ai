<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Genjutsu AI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="icons/icon-48.png" width="28" height="28" alt="" />
      <div class="brand">
        <h1>Genjutsu AI</h1>
        <p class="tagline">Motion transfer · Object swap</p>
      </div>
    </header>

    <main class="main">
      <section class="field" aria-labelledby="media-label">
        <div class="label-row">
          <label id="media-label" for="media-input">Media</label>
          <span class="hint">Images or videos · local preview only</span>
        </div>
        <label class="dropzone" id="dropzone" for="media-input">
          <input
            id="media-input"
            type="file"
            accept="image/*,video/*"
            multiple
            hidden
          />
          <span class="dropzone-title">Drop files here or click to browse</span>
          <span class="dropzone-sub">PNG, JPG, WEBP, MP4, MOV, WEBM</span>
        </label>
        <ul class="preview-list" id="preview-list" hidden></ul>
      </section>

      <section class="field" aria-labelledby="prompt-label">
        <div class="label-row">
          <label id="prompt-label" for="prompt">Prompt</label>
        </div>
        <textarea
          id="prompt"
          rows="4"
          placeholder="Describe the motion or swap you want…"
          maxlength="2000"
        ></textarea>
      </section>

      <button type="button" class="generate" id="generate">
        Generate on Genjutsu AI
      </button>

      <p class="footnote">
        Opens
        <a href="https://genjutsuai.net" target="_blank" rel="noopener noreferrer"
          >genjutsuai.net</a
        >
        to generate. Extension generation coming soon.
      </p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
